<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modificando informações no Firestore</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container text-white my-5">
    <h2>Games</h2>

    <ul data-js="games-list"></ul>

    <form data-js="add-game-form">
      <div class="mb-3">
        <label for="title" class="form-label">Nome</label>
        <input value="Elden Ring" class="form-control bg-transparent text-white" name="title" placeholder="Ex: Ghost of Tsushima" required autofocus>
      </div>
    
      <div class="mb-3">
        <label for="developer" class="form-label">Desenvolvedora</label>
        <input value="teste" class="form-control bg-transparent text-white" name="developer" placeholder="Ex: Capcom" required>
      </div>
    
      <button class="btn btn-primary">Adicionar game</button>
    </form>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
