<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <title>Quiz | Você consegue acertar de qual seriado é este personagem?</title>
</head>
<body>
  <div class="intro py-3 bg-success text-center">
    <div class="container">
      <h2 class="text-light display-3 my-4">Quiz</h2>
    </div>
  </div>

  <div class="result py-4 d-none bg-success text-center">
    <div class="container lead text-white">
      <p>Você acertou
        <span class="font-weight-bold display-4 p-3">0%</span>
        do quiz!
      </p>
    </div>
  </div>

  <div class="quiz py-4">
    <div class="container">
      <h2 class="my-5">Você consegue acertar de qual seriado é este personagem?</h2>

      <form class="quiz-form text-dark">
        <div class="my-5">
          <p class="lead font-weight-bold">1. Jesse Pinkman:</p>
          <div class="form-check my-2 text-dark">
            <label class="form-check-label">
              <input type="radio" name="inputQuestion1" value="A">
              Friends
            </label>
          </div>
          <div class="form-check my-2 text-dark">
            <label class="form-check-label">
              <input type="radio" name="inputQuestion1" value="B">
              Breaking Bad
            </label>
          </div>
          <div class="form-check my-2 text-dark">
            <label class="form-check-label">
              <input type="radio" name="inputQuestion1" value="C">
              Mr Robot
            </label>
          </div>
          <div class="form-check my-2 text-dark">
            <label class="form-check-label">
              <input type="radio" name="inputQuestion1" value="D">
              Bojack Horseman
            </label>
          </div>
          
        </div>

        <div class="my-5">
          <p class="lead font-weight-bold">2. Donald Draper</p>
          <div class="form-check my-2 text-dark">
            <label class="form-check-label">
              <input type="radio" name="inputQuestion2" value="A">
              This is Us
            </label>
          </div>
          <div class="form-check my-2 text-dark">
            <label class="form-check-label">
              <input type="radio" name="inputQuestion2" value="B">
              Mad Men
            </label>
          </div>
          <div class="form-check my-2 text-dark">
            <label class="form-check-label">
              <input type="radio" name="inputQuestion2" value="C">
              Round 6
            </label>
          </div>
          <div class="form-check my-2 text-dark">
            <label class="form-check-label">
              <input type="radio" name="inputQuestion2" value="D">
              Parks And Recreation
            </label>
          </div>
        </div>

        <div class="my-5">
          <p class="lead font-weight-bold">3. Audrey Horne:</p>
          <div class="form-check my-2 text-dark">
            <label class="form-check-label">
              <input type="radio" name="inputQuestion3" value="A">
              Twin Peaks
            </label>
          </div>
          <div class="form-check my-2 text-dark">
            <label class="form-check-label">
              <input type="radio" name="inputQuestion3" value="B">
              How I Met Your Mother
            </label>
          </div>
          <div class="form-check my-2 text-dark">
            <label class="form-check-label">
              <input type="radio" name="inputQuestion3" value="C">
              The Big Bang Theory
            </label>
          </div>
          <div class="form-check my-2 text-dark">
            <label class="form-check-label">
              <input type="radio" name="inputQuestion3" value="D">
              Prison Break
            </label>
          </div>
        </div>

        <div class="my-5">
          <p class="lead font-weight-bold">4. Howard Hamlin:</p>
          <div class="form-check my-2 text-dark">
            <label class="form-check-label">
              <input type="radio" name="inputQuestion4" value="A">
              Dark
            </label>
          </div>
          <div class="form-check my-2 text-dark">
            <label class="form-check-label">
              <input type="radio" name="inputQuestion4" value="B">
              Better Call Saul
            </label>
          </div>
          <div class="form-check my-2 text-dark">
            <label class="form-check-label">
              <input type="radio" name="inputQuestion4" value="C">
              How to Het Away With a Murder
            </label>
          </div>
          <div class="form-check my-2 text-dark">
            <label class="form-check-label">
              <input type="radio" name="inputQuestion4" value="D">
              Black Mirror
            </label>
          </div>
        </div>
        
        <div class="text-center">
          <button class="btn bg-success text-white">Enviar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
